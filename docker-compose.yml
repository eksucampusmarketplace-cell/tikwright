# Educational demonstration only — do not use on live platforms without explicit permission.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiktok
      POSTGRES_PASSWORD: tiktok
      POSTGRES_DB: tiktok_toolkit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  worker:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @tikwright/worker dev"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
volumes:
  redis-data:
  postgres-data:
